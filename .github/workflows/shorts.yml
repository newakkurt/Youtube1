name: Shorts Bot
on:
  schedule:
    - cron: "0 6 * * *"   # TSİ 09:00 (UTC 06:00) - 1. Video
    - cron: "0 10 * * *"  # TSİ 13:00 (UTC 10:00) - 2. Video
    - cron: "32 8 * * *"  # TSİ 13:00 (UTC 10:00) - 2. Video
    - cron: "0 14 * * *"  # TSİ 17:00 (UTC 14:00) - 3. Video
    - cron: "0 18 * * *"  # TSİ 21:00 (UTC 18:00) - 4. Video
    - cron: "0 19 * * 0"  # TSİ Pazar 22:00 (UTC 19:00) - Haftalık Rapor

  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [generate, process, report, lead]
        default: generate

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Mod belirle
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            M="report"
          else
            M="generate"
          fi
          echo "mode=$M" >> $GITHUB_OUTPUT

      - name: Çalıştır
        run: python main.py ${{ steps.mode.outputs.mode }}

      - name: State kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
