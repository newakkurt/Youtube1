name: Shorts Bot
on:
  schedule:
- cron: "17 6 * * *"
- cron: "43 10 * * *"
- cron: "11 14 * * *"
- cron: "37 18 * * *"
- cron: "0 19 * * 0"

  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [generate, process, report, lead, igtest]
        default: generate

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Mod belirle
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            M="report"
          else
            M="generate"
          fi
          echo "mode=$M" >> $GITHUB_OUTPUT

      - name: Çalıştır
        run: python main.py ${{ steps.mode.outputs.mode }}

      - name: State kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
