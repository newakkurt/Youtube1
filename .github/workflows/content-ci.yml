name: Content System CI
on:
  push:
    paths:
      - "main.py"
      - "script_gen.py"
      - "platform_captions.py"
      - ".github/workflows/content-ci.yml"
  pull_request:
    paths:
      - "main.py"
      - "script_gen.py"
      - "platform_captions.py"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile content pipeline
        run: python -m py_compile main.py script_gen.py platform_captions.py
