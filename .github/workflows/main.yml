name: Shorts Bot
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [generate, process]
        default: generate

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
      CONTENT_LANG: ${{ vars.CONTENT_LANG }}
      CHANNEL_TAG: ${{ vars.CHANNEL_TAG }}
      AFFILIATE_TEXT: ${{ vars.AFFILIATE_TEXT }}
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul
        run: echo "APP_DIR=$(dirname "$(find . -name main.py -not -path './.git/*' | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Bağımlılıklar
        run: pip install -r requirements.txt
        working-directory: ${{ env.APP_DIR }}

      - name: Video üret
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'generate') ||
          (github.event_name == 'schedule' && github.event.schedule != '*/30 * * * *')
        run: python main.py generate
        working-directory: ${{ env.APP_DIR }}

      - name: Telegram onaylarını işle
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'process') ||
          (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *')
        run: python main.py process
        working-directory: ${{ env.APP_DIR }}

      - name: State kaydet
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
